<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CleanRead</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --danger: #ef4444;
      --success: #22c55e;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 16px;
      width: 420px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .header h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--accent);
    }
    .header span {
      font-size: 11px;
      color: var(--muted);
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 5px;
      color: var(--text);
    }
    .field {
      margin-bottom: 12px;
    }
    input[type="text"],
    textarea {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 8px 10px;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 12px;
      outline: none;
    }
    input[type="text"]:focus,
    textarea:focus {
      border-color: var(--accent);
    }
    textarea {
      height: 150px;
      resize: vertical;
      line-height: 1.45;
      white-space: pre;
    }
    .folder-hint {
      margin-top: 4px;
      font-size: 11px;
      color: var(--muted);
    }
    .actions {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.15s ease, opacity 0.15s ease;
    }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    #startBtn {
      flex: 1;
      background: var(--accent);
      color: #082f49;
    }
    #startBtn:hover:not(:disabled) {
      background: var(--accent-hover);
      color: #ffffff;
    }
    #stopBtn {
      background: var(--danger);
      color: #ffffff;
      display: none;
    }
    #openFolderBtn {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
    }
    #openFolderBtn:hover {
      border-color: var(--accent);
    }
    .status-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
    }
    .status-header {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 12px;
    }
    .progress-bar {
      width: 100%;
      height: 6px;
      background: #0f172a;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.25s ease;
    }
    .logs {
      max-height: 110px;
      overflow-y: auto;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 11px;
      line-height: 1.4;
      color: var(--muted);
    }
    .log-item {
      margin-bottom: 3px;
      word-break: break-all;
    }
    .log-item.success {
      color: var(--success);
    }
    .log-item.error {
      color: var(--danger);
    }
    .log-item.warn {
      color: #fbbf24;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>CleanRead</h1>
    <span>Text-Only Markdown Saver</span>
  </div>

  <div class="field">
    <label for="subfolderInput">Downloads Subfolder</label>
    <input type="text" id="subfolderInput" value="CleanRead" placeholder="CleanRead" />
    <div class="folder-hint">Saves files to <code>Downloads/<span id="folderPreview">CleanRead</span>/</code></div>
  </div>

  <div class="field">
    <label for="urlsInput">Paste URLs (one per line)</label>
    <textarea id="urlsInput" placeholder="https://example.com/article-1&#10;https://example.com/article-2"></textarea>
  </div>

  <div class="actions">
    <button id="startBtn">Convert URLs to Markdown</button>
    <button id="stopBtn">Stop</button>
    <button id="openFolderBtn" title="Open Downloads Folder">Folder</button>
  </div>

  <div class="status-box">
    <div class="status-header">
      <span id="statusText">Idle</span>
      <span id="counterText">0 / 0</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="logs" id="logsContainer"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
